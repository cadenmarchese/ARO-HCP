rule_files:
- ingressCertRotation-prometheusRule.yaml
evaluation_interval: 1m
tests:
# Test 1: Warning fires when 56% of lifetime has elapsed (past 0.55 threshold)
# Cert total lifetime = 60000s. not_before = -33600 so at time()=0,
# elapsed fraction = 33600/60000 = 0.56 > 0.55.
- interval: 1m
  input_series:
  - series: 'x509_cert_not_before{secret_namespace="aks-istio-ingress", secret_name="frontend-credential"}'
    values: '-33600x70'
  - series: 'x509_cert_not_after{secret_namespace="aks-istio-ingress", secret_name="frontend-credential"}'
    values: '26400x70'
  alert_rule_test:
  - eval_time: 65m
    alertname: IngressCertRotationOverdue
    exp_alerts:
    - exp_labels:
        secret_namespace: aks-istio-ingress
        secret_name: frontend-credential
        severity: warning
        component: ingress-cert-rotation
      exp_annotations:
        description: 'Ingress certificate frontend-credential rotation is overdue. More than 55% of the certificate lifetime has elapsed. Key Vault auto-renew should have replaced it at 50%.'
        summary: 'Ingress certificate frontend-credential rotation is overdue'
        correlationId: 'IngressCertRotationOverdue/frontend-credential'

# Test 2: No alert when only 40% of lifetime has elapsed (healthy cert)
# not_before = -24000 so elapsed = 24000/60000 = 0.40 < 0.55
- interval: 1m
  input_series:
  - series: 'x509_cert_not_before{secret_namespace="aks-istio-ingress", secret_name="sessiongate-credential"}'
    values: '-24000x70'
  - series: 'x509_cert_not_after{secret_namespace="aks-istio-ingress", secret_name="sessiongate-credential"}'
    values: '36000x70'
  alert_rule_test:
  - eval_time: 65m
    alertname: IngressCertRotationOverdue
    exp_alerts: []

# Test 3: No alert for freshly rotated cert (near 0% elapsed)
# not_before = -600 so elapsed = 600/60000 = 0.01
- interval: 1m
  input_series:
  - series: 'x509_cert_not_before{secret_namespace="aks-istio-ingress", secret_name="frontend-credential"}'
    values: '-600x70'
  - series: 'x509_cert_not_after{secret_namespace="aks-istio-ingress", secret_name="frontend-credential"}'
    values: '59400x70'
  alert_rule_test:
  - eval_time: 65m
    alertname: IngressCertRotationOverdue
    exp_alerts: []

# Test 4: Cert in a different namespace does not trigger alert
- interval: 1m
  input_series:
  - series: 'x509_cert_not_before{secret_namespace="other-namespace", secret_name="frontend-credential"}'
    values: '-43200x40'
  - series: 'x509_cert_not_after{secret_namespace="other-namespace", secret_name="frontend-credential"}'
    values: '16800x40'
  alert_rule_test:
  - eval_time: 35m
    alertname: IngressCertRotationOverdue
    exp_alerts: []
